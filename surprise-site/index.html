<title>СЮРПРИЗ 🖕</title>
<style>
:root {color-scheme:dark}
* {box-sizing:border-box}
html, body {margin:0; width:100%;height:100%; background:#09080f; overflow:hidden}
body {font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif; color:#fff}
main {position:relative; isolation:isolate; height:100vh; height:100svh; width:100%; display:flex; justify-content:center; align-items:flex-end; overflow:hidden; background:#09080f}
main::before {content:""; position:absolute; z-index:-2; inset:-18%; background:radial-gradient(ellipse 45% 55% at 50% 48%,rgba(135,39,118,.48),transparent 75%),radial-gradient(ellipse 48% 40% at 43% 98%,rgba(59,40,135,.42),transparent 80%); animation:glow 10s ease-in-out infinite alternate;}
main::after {content:"";position:absolute;pointer-events:none;inset:0; z-index:3;box-shadow:inset 0 0 min(9vw,100px) rgba(0,0,0,.3)}
.person {height:min(98svh,1100px);max-height:100%;width:auto;max-width:none;object-fit:contain; object-position:center bottom;display:block;user-select:none;-webkit-user-drag:none;transform-origin:bottom center;animation:arrive .8s cubic-bezier(.16,1,.3,1) both;filter:drop-shadow(0 20px 50px rgba(0,0,0,.36));}
/* On tall / narrow screens preserve both hands and the whole pose. */
@media (max-aspect-ratio: 9/10) {main {align-items:center} .person {width:100vw;max-width:100vw;height:auto;max-height:100svh;object-fit:contain}}
@media (min-aspect-ratio: 19/9) {.person{height:105svh}}
@keyframes arrive{from {opacity:0;transform:scale(.96) translateY(15px);filter:blur(9px)}to{opacity:1;transform:scale(1) translateY(0);filter:blur(0)}}
@keyframes glow{from{transform:scale(1)}to{transform:scale(1.17)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style>
</head>
