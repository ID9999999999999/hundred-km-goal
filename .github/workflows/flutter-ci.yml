name: Build Android APK

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/**

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android platform
        run: flutter create --platforms=android --org com.yasser .

      - name: Add Android location permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text()
          permissions = '''<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
          <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
          <uses-permission android:name="android.permission.INTERNET" />
          '''
          if 'android.permission.ACCESS_FINE_LOCATION' not in text:
              text = text.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    ' + permissions)
          text = text.replace('android:label="hundred_km_goal"', 'android:label="Цель — 100 км"')
          path.write_text(text)
          PY

      - name: Remove generated default widget test
        run: rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Upload visual previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stadium-ru-previews
          path: build/previews/*.png
          if-no-files-found: ignore

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hundred-km-goal-stadium-ru-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
